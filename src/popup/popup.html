<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Adaptive Playback</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <span class="dot" id="dot"></span>
      <span id="status">Checking...</span>
    </header>

    <div class="speed" id="speed" hidden>
      <span class="value" id="speedValue">1.00</span><span class="unit">x</span>
    </div>

    <dl id="numbers" hidden>
      <dt>Original</dt>
      <dd id="original">-</dd>
      <dt>At this pace</dt>
      <dd id="watch">-</dd>
      <dt>Saved</dt>
      <dd id="saved">-</dd>
    </dl>

    <section class="moment" id="moment" hidden>
      <h2>Right now</h2>
      <dl>
        <dt>Difficulty</dt>
        <dd id="momentDifficulty">-</dd>
        <dt>Speaker</dt>
        <dd id="momentWpm">-</dd>
        <dt>Playing at</dt>
        <dd id="momentSpeed">-</dd>
      </dl>
    </section>

    <p class="note" id="note"></p>
    <p class="note" id="analysisNote"></p>
    <p class="note timing" id="timingNote"></p>

    <button type="button" class="primary" id="toggle" hidden>Enable for this video</button>
    <button type="button" id="openOptions">Settings</button>

    <script src="popup.js"></script>
  </body>
</html>
